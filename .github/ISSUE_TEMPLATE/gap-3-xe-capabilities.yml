## Rules for this repo

- **A claim without a source will be marked as unverified** — please cite the spec chapter/version, or describe the measurement you performed.
- Do **not** post speculation, vendor marketing language, or "should be fine" style answers. If you are unsure, say so; that is a useful data point.
- If you can **refute** something in our docs, that is equally welcome — cite the evidence.
