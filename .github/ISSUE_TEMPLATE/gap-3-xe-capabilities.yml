## What this gap is

The operator-mapping table has 34 rows, and **both the "XMX direct support" and "recommended path" columns are marked "needs external documentation" for 34/34 rows** — deliberately, because the author had **no Intel toolchain and no Xe hardware**, so no capability conclusion could be verified.

> Those blanks are **intentional, not omissions**. This project does **not** speculate about hardware capabilities.

## The checklist

The full 51-item list is in [`docs/05-Intel可行性评估.md`](../../docs/05-Intel可行性评估.md), chapter 9. Highest-priority items:

1. **G-01** — Does Intel XMX provide directly callable primitives for matrix multiply / convolution, and what precision modes (FP8 / FP16 / BF16 / INT8) are covered?
2. **G-02** — Is there an Xe-side primitive replacing split-K convolution semantics, and is the floating-point accumulation order of split-K reductions constrained by spec (this affects numerical reproducibility)?
3. **G-03** — Does Xe provide window/shift primitives needed by Swin attention, and what is the feasible range of the `swin_var` window parameter (32/64/128/256)?
4. **G-04** — Feasibility and performance boundary of the generic (non-XMX) SPIR-V path for this workload.

