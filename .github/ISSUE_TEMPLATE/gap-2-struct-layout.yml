## Sanity checks we will run

Your layout should be consistent with:

- total = **168** (or **40**) bytes,
- `kernarg_segment_size` = `by_value` + `66` + `190` for the 31 standard-shape kernels (and the identity breaks for the 3 exception kernels),
- `kernarg_segment_align = 8`.

Please state explicitly if your layout matches the totals only **approximately**, or only under a specific pointer size.
