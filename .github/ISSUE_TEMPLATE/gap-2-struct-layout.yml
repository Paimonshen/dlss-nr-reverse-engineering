## What this gap is

Two user-parameter structs have unresolved **internal field composition**:

| Struct | Kernel(s) | `by_value` size (from DLL metadata) |
|---|---|---|
| `VarParams` | `k_swin_var<...>` (5 kernels: k29–k33) | **168 bytes** |
| `SwinParams` | `k_swin_1h_32_fp8` (k0) | **40 bytes** |

The DLL metadata declares only the **total byte count** of the `by_value` parameter — it carries **no field names and no field boundaries**.

**What we already ruled out**: a re-implementation source tree contains same-named structs; counted with 64-bit pointers they come to **92 bytes**, which matches **neither** 168 nor 40. So the source structs **cannot** be used as the DLL-side layout.

## What we need from you

- [ ] **Upstream struct definitions** for `VarParams` and/or `SwinParams` (source, header, or decompiled form)
- [ ] **AMD toolchain layout rules** for `by_value` struct parameters — including implicit padding/alignment rules that would explain 168 and 40
- [ ] **Other evidence** that pins the field boundaries (e.g. reader-side code that indexes into the struct)

