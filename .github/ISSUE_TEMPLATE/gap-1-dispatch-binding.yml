## What this gap is

The study established the topology, the per-block **layer counts**, and the set of **34 kernel names** — but **not** which layer dispatches to which kernel.

Four avenues are closed in the original author's environment:
1. DLL static analysis is at its boundary (the dispatch body has no intersection with the kernel-launch functions).
2. The in-workspace source is a stub (`return true;`) and **non-isomorphic** to the DLL (only 2 of 34 kernel names overlap).
3. The weight file is exhausted (140 byte patterns over the whole file including payload; no `shape`/`dtype`/operator/`block`-index/`kernel`-name fields; index-region unattributed bytes = 0; no second table).
4. Runtime observation is unavailable (no AMD hardware).

## What we need from you

Please tell us **which of these you have**, and attach/provide it:

- [ ] **Upstream network definition** — `.onnx` / `.safetensors` / export script / training config
- [ ] **Upstream pass-side source** — the code that builds and dispatches the network
- [ ] **A runtime dump of the actual dispatch sequence** (from a run on AMD hardware) — e.g. the ordered list of (block, layer, kernel) triples
- [ ] **Other** (describe)

