## Evidence requirement

This project requires **reproducible evidence**. For a mapping claim, please give at least one of:

- a file + line range (for source), or
- a byte offset + raw bytes (for binary), or
- the command you ran and its output (for a dump).

> A correct claim with insufficient evidence will be asked to add evidence — it will **not** be rejected outright.

## Why this matters

This is the **single blocking gap** for the porting roadmap: without the binding, the "71-row dispatch table" milestone cannot be completed on evidence.
